# Cloud Build pipeline: clone the public repo, build the image with the RFC
# database baked in, push it to Artifact Registry, and deploy it to Cloud Run.
#
# The build clones the repo itself (rather than relying on uploaded source), so
# it is not associated with a GitHub commit and posts no GitHub status check.
# The same config works for both one-off and scheduled deploys.
#
# Source pinning: this config is designed for scheduled/manual `--no-source`
# runs, where Cloud Build's $COMMIT_SHA is not populated, so a mutable branch
# ref (_REF) is the default way to choose what to build — a scheduled run is
# expected to pick up the branch tip. To pin a build to an exact upstream
# commit, set _COMMIT (a full commit SHA); it takes precedence over _REF.
# Whatever gets checked out, its commit SHA becomes the image tag, so the
# deployed image is always addressed by an immutable per-commit tag (:latest
# is still pushed as a convenience alias but never deployed).
#
# _FROM_RFC / _TO_RFC default to empty, baking in the full RFC corpus (~9800
# RFCs). Set them to restrict the database to a numeric RFC range, e.g. for a
# fast smoke-test image.
#
# _PUBLIC defaults to "true", granting allUsers roles/run.invoker on every
# deploy (this is a public MCP server). Set it to anything else to keep the
# service private: the binding is then actively removed, so a service left
# public by an earlier deploy is locked down again.
#
# Manual run (full corpus):
#   gcloud builds submit --no-source --config cloudbuild.yaml \
#     --substitutions=_REF=main,_REGION=asia-northeast1,_REPO=rfc-mcp,_SERVICE=rfc-mcp
#
# Manual run (restricted range):
#   gcloud builds submit --no-source --config cloudbuild.yaml \
#     --substitutions=_REF=main,_FROM_RFC=9290,_TO_RFC=9295,_REGION=asia-northeast1,_REPO=rfc-mcp,_SERVICE=rfc-mcp
#
# Scheduled run: start it from Cloud Scheduler via the Cloud Build API, so the
# database picks up newly issued RFCs on a cadence.
#
# Prerequisites:
#   - An Artifact Registry Docker repository named ${_REPO} in ${_REGION}.
#   - The Cloud Build service account has roles/run.admin and
#     roles/iam.serviceAccountUser (to deploy to Cloud Run).

substitutions:
  _REF: "main"
  _COMMIT: ""
  _FROM_RFC: ""
  _TO_RFC: ""
  _REGION: "asia-northeast1"
  _REPO: "rfc-mcp"
  _SERVICE: "rfc-mcp"
  _PUBLIC: "true"

options:
  # The database build fetches ~9800 RFCs individually (no bulk tarball); give
  # it a few CPUs for parallel workers.
  machineType: E2_HIGHCPU_8
  # Required when the build runs as a user-specified service account; without a
  # logs bucket, logs must go to Cloud Logging.
  logging: CLOUD_LOGGING_ONLY

# Local measurement (2026-07-11, 16 workers): full corpus build is ~8 minutes.
# Leave generous headroom for Cloud Build's network conditions and worker count.
timeout: 3600s

steps:
  - id: clone
    name: gcr.io/cloud-builders/git@sha256:c9fbabc7a67ae911e2c16af928377083d0f121f1346ac7c6dbb3062348c40dc5
    entrypoint: bash
    args:
      - -ceu
      - |
        git clone --filter=blob:none --no-checkout https://github.com/higebu/rfc-mcp repo
        cd repo
        if [ -n "${_COMMIT}" ]; then
          git fetch origin "${_COMMIT}"
          git checkout --detach "${_COMMIT}"
        else
          git fetch --depth=1 origin "${_REF}"
          git checkout --detach FETCH_HEAD
        fi
        # The checked-out commit becomes the immutable image tag, shared with
        # the later steps via the workspace.
        git rev-parse --short=12 HEAD > /workspace/image_tag

  - id: build
    name: gcr.io/cloud-builders/docker@sha256:e85f8f20f7b533e74a4b1be279b9ff2b45dcc20ab97de9b302c26715a9d9ffc8
    dir: repo
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        TAG="$$(cat /workspace/image_tag)"
        docker build \
          --build-arg=FROM_RFC=${_FROM_RFC} \
          --build-arg=TO_RFC=${_TO_RFC} \
          -t "$$IMAGE:$$TAG" \
          -t "$$IMAGE:latest" \
          .

  - id: push
    name: gcr.io/cloud-builders/docker@sha256:e85f8f20f7b533e74a4b1be279b9ff2b45dcc20ab97de9b302c26715a9d9ffc8
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        TAG="$$(cat /workspace/image_tag)"
        docker push "$$IMAGE:$$TAG"
        docker push "$$IMAGE:latest"

  # Deploy via a service spec so we can configure the startup/liveness probes
  # (gcloud run deploy has no flags for probes). add-iam-policy-binding replaces
  # the convenience of --allow-unauthenticated.
  - id: deploy
    name: gcr.io/google.cloud-sdk:slim
    entrypoint: bash
    dir: repo
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        TAG="$$(cat /workspace/image_tag)"
        sed \
          -e "s|__SERVICE__|${_SERVICE}|g" \
          -e "s|__IMAGE__|$$IMAGE:$$TAG|g" \
          service.yaml > /workspace/service.rendered.yaml
        gcloud run services replace /workspace/service.rendered.yaml --region=${_REGION}
        if [ "${_PUBLIC}" = "true" ]; then
          gcloud run services add-iam-policy-binding ${_SERVICE} \
            --region=${_REGION} --member=allUsers --role=roles/run.invoker
        else
          # Actively revoke the binding so a service made public by an
          # earlier _PUBLIC="true" deploy does not stay public. Only a
          # binding-not-found error (fresh service) is tolerated; any other
          # failure (permissions, API error) fails the build so a private
          # deploy can never silently stay public.
          echo "Removing allUsers invoker binding (_PUBLIC=${_PUBLIC})"
          if ! out=$$(gcloud run services remove-iam-policy-binding ${_SERVICE} \
            --region=${_REGION} --member=allUsers --role=roles/run.invoker \
            --quiet 2>&1); then
            echo "$$out"
            case "$$out" in
              *"not found"*|*"NOT_FOUND"*) echo "Binding already absent; continuing." ;;
              *) echo "Failed to revoke public invoker binding" >&2; exit 1 ;;
            esac
          fi
        fi
