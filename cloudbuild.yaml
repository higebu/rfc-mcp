# Cloud Build pipeline: clone the public repo, build the image with the RFC
# database baked in, push it to Artifact Registry, and deploy it to Cloud Run.
#
# The build clones the repo itself (rather than relying on uploaded source), so
# it is not associated with a GitHub commit and posts no GitHub status check.
# The same config works for both one-off and scheduled deploys.
#
# _FROM_RFC / _TO_RFC default to empty, baking in the full RFC corpus (~9800
# RFCs). Set them to restrict the database to a numeric RFC range, e.g. for a
# fast smoke-test image.
#
# Manual run (full corpus):
#   gcloud builds submit --no-source --config cloudbuild.yaml \
#     --substitutions=_REF=main,_REGION=asia-northeast1,_REPO=rfc-mcp,_SERVICE=rfc-mcp
#
# Manual run (restricted range):
#   gcloud builds submit --no-source --config cloudbuild.yaml \
#     --substitutions=_REF=main,_FROM_RFC=9290,_TO_RFC=9295,_REGION=asia-northeast1,_REPO=rfc-mcp,_SERVICE=rfc-mcp
#
# Scheduled run: start it from Cloud Scheduler via the Cloud Build API, so the
# database picks up newly issued RFCs on a cadence.
#
# Prerequisites:
#   - An Artifact Registry Docker repository named ${_REPO} in ${_REGION}.
#   - The Cloud Build service account has roles/run.admin and
#     roles/iam.serviceAccountUser (to deploy to Cloud Run).

substitutions:
  _REF: "main"
  _FROM_RFC: ""
  _TO_RFC: ""
  _REGION: "asia-northeast1"
  _REPO: "rfc-mcp"
  _SERVICE: "rfc-mcp"

options:
  # The database build fetches ~9800 RFCs individually (no bulk tarball); give
  # it a few CPUs for parallel workers.
  machineType: E2_HIGHCPU_8
  # Required when the build runs as a user-specified service account; without a
  # logs bucket, logs must go to Cloud Logging.
  logging: CLOUD_LOGGING_ONLY

# Local measurement (2026-07-11, 16 workers): full corpus build is ~8 minutes.
# Leave generous headroom for Cloud Build's network conditions and worker count.
timeout: 3600s

steps:
  - id: clone
    name: gcr.io/cloud-builders/git
    args:
      - clone
      - --depth=1
      - --branch=${_REF}
      - https://github.com/higebu/rfc-mcp
      - repo

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: repo
    args:
      - build
      - --build-arg=FROM_RFC=${_FROM_RFC}
      - --build-arg=TO_RFC=${_TO_RFC}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

  # Deploy via a service spec so we can configure the startup/liveness probes
  # (gcloud run deploy has no flags for probes). add-iam-policy-binding replaces
  # the convenience of --allow-unauthenticated.
  - id: deploy
    name: gcr.io/google.cloud-sdk:slim
    entrypoint: bash
    dir: repo
    args:
      - -c
      - |
        set -euo pipefail
        sed \
          -e "s|__SERVICE__|${_SERVICE}|g" \
          -e "s|__IMAGE__|${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest|g" \
          service.yaml > /workspace/service.rendered.yaml
        gcloud run services replace /workspace/service.rendered.yaml --region=${_REGION}
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --member=allUsers --role=roles/run.invoker
